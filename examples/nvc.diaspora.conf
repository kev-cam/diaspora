# diaspora.conf for the kev-cam/nvc fork: Nick Gasson's nvc is a peer.
# Copy to the top of the nvc checkout as diaspora.conf.

[diaspora]
	target = master
	import = bugfix security perf
	ignore = docs ci style
	export = bugfix

[peer "nickg"]
	url = https://github.com/nickg/nvc.git
	branch = master
	# his release notes, web site and CI are his own
	exclude = www/** NEWS.md .github/** contrib/**

# Commands run in the import worktree ($DIASPORA_SRC); the build directory
# ($DIASPORA_BUILD) is kept between runs, so only the first build is long.
# bin/nvc is built first: a from-scratch `smak -j` otherwise starts the
# library rules before the binary they run exists.
[test "compile"]
	run = mkdir -p "$DIASPORA_BUILD" && cd "$DIASPORA_BUILD"
	run = { [ -f Makefile ] || { (cd "$DIASPORA_SRC" && ./autogen.sh) && "$DIASPORA_SRC/configure" --disable-maintainer-mode 'CFLAGS=-O2 -g -fPIC'; }; }
	run = smak -j"$(nproc)" bin/nvc && smak -j"$(nproc)"
	timeout = 40m

[test "unit"]
	needs = compile
	run = cd "$DIASPORA_BUILD" && smak -j"$(nproc)" bin/unit_test && ./bin/unit_test
	timeout = 30m

[test "regress"]
	needs = unit
	run = cd "$DIASPORA_BUILD" && smak -j"$(nproc)" check
	timeout = 3h
	retry = 1

# A fix must pass the full regression; a test-only change the unit tests.
[require]
	default = regress
	test = unit
	docs = none

# Where the fork has gone its own way: the agent ports the intent there
# instead of trusting a diff that happens to apply.
#[divergence]
#	rewritten = src/rt/** src/jit/**
