# diaspora.conf for the kev-cam/xyce fork: Sandia's Xyce is a peer.
# Copy to the top of the xyce checkout as diaspora.conf.
#
# Xyce is too big to build twice, so imports are applied in the checkout
# itself (it must be clean) and built in the build tree that already
# exists.  Put the build tree's path in diaspora.local.conf, which is not
# committed:
#
#	[diaspora]
#		build = /usr/local/src/xyce-build

[diaspora]
	target = master
	workspace = inplace
	# one build and one regression for the whole batch; the imports are
	# tested one by one only if the batch fails
	strategy = batch
	import = bugfix security
	ignore = docs ci style build

[peer "sandia"]
	url = https://github.com/Xyce/Xyce.git
	branch = master
	exclude = doc/** .github/**

[test "compile"]
	run = cd "$DIASPORA_BUILD" && smak -j"$(nproc)" all
	timeout = 3h

# EDIT: the regression command for this machine (Xyce_Regression checkout,
# tags, where the results go).
[test "regress"]
	needs = compile
	run = echo "set the Xyce_Regression command in diaspora.conf" && false
	timeout = 8h

[require]
	default = regress
	docs = none

# Paths that are never offered to a peer.
